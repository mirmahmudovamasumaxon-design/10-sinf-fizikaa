const D=[
{t:"Prujinali va matematik mayatniklar",k:"Tebranish davri",s:"spring",f:"T = 2π√(m/k) ; T = 2π√(l/g)",th:["Prujinali mayatnik: yuk massasi m va prujina bikrligi k davrni belgilaydi.","Matematik mayatnik: davr uzunlik l va g ga bog‘liq, massaga va (kichik burchakda) amplitudaga bog‘liq emas.","Chastota ν = 1/T, birligi Gts."],y:"Formulalarni keltirib chiqarish, massani o‘zgartirib davr o‘zgarishini kuzatish.",m:"3 ta hisoblash masalasi (T, ν, k).",q:[["Prujina bikrligi 4 marta oshsa, davr…","2 marta ortadi|2 marta kamayadi|4 marta kamayadi",1],["l = 1 m uzunlikdagi mayatnik davri taxminan…","1 s|2 s|3 s",1]],u:"Darslikdagi mashqlar; l=0,4 m mayatnik T ni hisoblang."},
{t:"Laboratoriya: erkin tushish tezlanishini aniqlash",k:"g ni o‘lchash",s:"pend",f:"g = 4π²·l / T²",th:["Mayatnikni 30 marta tebratib vaqt o‘lchanadi: T = t/N.","3 xil uzunlikda tajriba qilinadi, g ning o‘rtacha qiymati olinadi.","Xatolik: δ = |g_o‘rt − 9,81| / 9,81 · 100 %."],y:"Jihozlar: ip, sharcha, sekundomer, o‘lchov lentasi. 3 ta o‘lchash.",m:"Jadvalni to‘ldirish va xulosa yozish.",q:[["l = 0,25 m, T = 1 s bo‘lsa g ≈","9,87 m/s²|4,9 m/s²|19,6 m/s²",0],["Davrni aniqroq o‘lchash uchun…","1 ta tebranishni o‘lchash|30 ta tebranish vaqtini o‘lchash|ipni qisqartirish",1]],u:"Laboratoriya hisobotini rasmiylashtiring."},
{t:"Mexanik to‘lqinlar",k:"λ, T, ν, v",s:"wave",v:2,f:"λ = v·T = v / ν",th:["To‘lqin — tebranishning muhitda tarqalishi; modda emas, energiya ko‘chadi.","Ko‘ndalang to‘lqinda zarralar tarqalish yo‘nalishiga perpendikulyar, bo‘ylama to‘lqinda bo‘ylab tebranadi.","To‘lqin uzunligi — bir davrda bosib o‘tilgan masofa."],y:"Arqon va prujina bilan namoyish; λ, ν, v bog‘lanishi.",m:"Grafik bo‘yicha λ va ν ni topish.",q:[["v = 2 m/s, ν = 4 Hz bo‘lsa λ =","0,5 m|2 m|8 m",0],["Ko‘ndalang to‘lqinda zarralar tebranishi to‘lqin yo‘nalishiga…","parallel|perpendikulyar|bog‘liq emas",1]],u:"v=340 m/s, ν=85 Hz bo‘lsa λ ni toping."},
{t:"Tovush to‘lqinlari",k:"Balandlik, tembr, kuch",s:"wave",v:340,f:"v ≈ 340 m/s ; λ = v / ν",th:["Tovush — havoda tarqaluvchi bo‘ylama to‘lqin; vakuumda tarqalmaydi.","Balandlik — chastotaga, kuchlilik — amplitudaga, tembr — to‘lqin shakliga bog‘liq.","Eshitish chegarasi 16–20000 Gts; undan past — infra-, yuqori — ultratovush."],y:"Kamerton tajribasi, aks-sado.",m:"Aks-sado masalasi: s = v·t / 2.",q:[["v = 340 m/s, ν = 170 Hz bo‘lsa λ =","0,5 m|2 m|5 m",1],["Tovush balandligi nimaga bog‘liq?","amplitudaga|chastotaga|massaga",1]],u:"Chaqmoq va momaqaldiroq oralig‘i 3 s bo‘lsa, masofa nechta?"},
{t:"Masalalar yechish: tebranish va to‘lqinlar",k:"Masala algoritmi",s:"spring",f:"ν = 1/T ; v = λ·ν",th:["Algoritm: berilgan → SI → formula → hisob → tekshirish.","Davr va chastotani bir-biriga o‘tkazing: ν = 1/T.","To‘lqin tezligi v = λ/T."],y:"Namuna masalalar tahlili, guruhlarda yechish.",m:"A, B, C darajali masalalar.",q:[["T = 0,5 s bo‘lsa ν =","0,5 Hz|2 Hz|5 Hz",1],["λ = 3 m, T = 0,5 s bo‘lsa v =","1,5 m/s|6 m/s|0,17 m/s",1]],u:"Darslikdan 5 ta masala."},
{t:"Suyuqlik va gazlar harakati",k:"Uzluksizlik tenglamasi",s:"pipe",f:"S₁·v₁ = S₂·v₂",th:["Ideal suyuqlik siqilmaydi va ishqalanmaydi.","Nayning har bir kesimidan bir xil hajm oqadi: S·v = const.","Kesim kichrayganda oqim tezligi ortadi (shlang barmoq bilan siqilganda)."],y:"Oqim chiziqlari, nay kesimi va tezlik bog‘lanishi.",m:"Nay masalalari; hayotiy misollar.",q:[["S₁=40, v₁=2 m/s, S₂=10 bo‘lsa v₂=","0,5 m/s|8 m/s|20 m/s",1],["Nay torayganda oqim tezligi…","kamayadi|ortadi|o‘zgarmaydi",1]],u:"Shlang va daryo misolida uzluksizlikni tushuntiring."},
{t:"Gaz va suyuqlik bosimining tezlikka bog‘liqligi",k:"Bernulli qonuni",s:"pipe",f:"p + ρv²/2 = const",th:["Tezlik katta joyda bosim kichik, tezlik kichik joyda bosim katta.","Pulverizator, karbyurator, Venturi nayi shu qonunga asoslangan.","Samolyot qanoti ustida tezlik katta, bosim kichik → ko‘tarish kuchi."],y:"Qog‘oz varag‘i ustiga puflash tajribasi.",m:"2 ta masala.",q:[["Nayning tor qismida bosim…","kamayadi|ortadi|o‘zgarmaydi",0],["Samolyot qanoti ko‘tarish kuchi sababi…","yuqorida bosim kichik|pastda bosim kichik|massa kamayishi",0]],u:"Hayotdagi 3 ta Bernulli misoli."},
{t:"Masalalar yechish: suyuqlik va gazlar",k:"Uzluksizlik va Bernulli",s:"pipe",f:"v₂ = v₁S₁/S₂ ; Δp = ρ(v₂²−v₁²)/2",th:["Avval v₂ ni uzluksizlikdan toping.","So‘ng Bernulli bilan bosimlar farqini hisoblang.","Birliklarni SI ga o‘tkazishni unutmang."],y:"Namuna tahlili, juftlikda ishlash.",m:"O‘zaro tekshiruv.",q:[["v₁ = 1 m/s, S₁/S₂ = 5 bo‘lsa v₂ =","0,2 m/s|5 m/s|25 m/s",1],["ρ=1000, v₁=1, v₂=5 bo‘lsa Δp =","12 kPa|24 kPa|2 kPa",0]],u:"Darslikdan 4 ta masala."},
{t:"4-BSB (30 ball)",k:"Bo‘lim bo‘yicha nazorat",s:"wave",v:340,f:"BSB: 10 ta test + 3 ta masala",th:["Mavzular: tebranish, to‘lqinlar, tovush, suyuqlik oqimi.","Test — 10 ball, masalalar — 20 ball.","Baho: 27–30 ball «5», 21–26 «4», 15–20 «3»."],y:"Nazorat ishi, 2 variant.",m:"Xatolar tahlili.",q:[["Chastota birligi","Metr|Gerts|Nyuton",1],["Tovush vakuumda…","tarqalmaydi|tez tarqaladi|sekin tarqaladi",0]],u:"Xatolar ustida ishlash."},
{t:"Elektr maydon kuchlanganligining superpozitsiyasi",k:"Maydonlarni qo‘shish",s:"field",f:"E = E₁ + E₂ + … (vektor)",th:["E = F/q — maydonning kuch tavsifi, birligi N/C.","Nuqtaviy zaryad maydoni E = kq/r².","Bir nechta zaryad maydoni vektor yig‘indi: perpendikulyar bo‘lsa E = √(E₁²+E₂²)."],y:"Zaryad ishorasi va miqdorini o‘zgartirib maydonni kuzatish.",m:"Ikki zaryad orasidagi nuqtada E.",q:[["E₁=3, E₂=4 N/C perpendikulyar bo‘lsa E =","7 N/C|5 N/C|1 N/C",1],["Bir yo‘nalishda E₁=3, E₂=4 bo‘lsa E =","7|5|1",0]],u:"Ikki zaryad uchun maydon chizmasi."},
{t:"Zaryadlangan sharning elektr maydoni",k:"E(r) grafigi",s:"field",f:"r > R: E = kq/r² ; r < R: E = 0",th:["Sharning tashqarisida maydon nuqtaviy zaryaddagidek.","Zaryadlangan o‘tkazgich shar ichida E = 0.","Sirt yaqinida E maksimal, uzoqlashgan sari 1/r² qonuni bilan kamayadi."],y:"E(r) grafigini chizish.",m:"3 ta masala.",q:[["Zaryadlangan o‘tkazgich shar ichida E =","maksimal|0|kq/R²",1],["r 2 marta oshsa (tashqarida) E…","2 marta kamayadi|4 marta kamayadi|o‘zgarmaydi",1]],u:"E(r) grafigini daftarga chizing."},
{t:"Masalalar yechish: elektr maydon",k:"Kulon va E",s:"field",f:"E = F/q ; F = k·q₁q₂/r²",th:["Kuch Kulon qonuni bilan, maydon E = F/q bilan topiladi.","Masofa 3 marta oshsa, kuch 9 marta kamayadi.","Chizma chizib, vektorlarni proyeksiyada qo‘shing."],y:"Namuna masalalar.",m:"Darajali masalalar.",q:[["F = 4 N, q = 2 C bo‘lsa E =","2 N/C|8 N/C|0,5 N/C",0],["r 3 marta oshsa Kulon kuchi…","3 marta kamayadi|9 marta kamayadi|9 marta oshadi",1]],u:"Darslikdan 4 ta masala."},
{t:"2-ChSB (40 ball)",k:"Chorak yakuniy baholash",s:"field",f:"ChSB: test 15 + masala 25",th:["Mavzular: butun II chorak (19–30-darslar).","Vaqt: 45 daqiqa.","Baho: 36–40 «5», 28–35 «4», 20–27 «3»."],y:"Yozma ish.",m:"Natijalarni e’lon qilish.",q:[["Elektr maydon kuchlanganligi birligi","N/C|J|Pa",0],["Zaryadlangan shar ichida E =","0|kq/r²|maksimal",0]],u:"Xatolar ustida ishlash."},
{t:"Maydonda nuqtaviy zaryadni ko‘chirishda bajarilgan ish",k:"A = qEd",s:"work",f:"A = q·E·d·cosα",th:["Bir jinsli maydonda ish A = qEd.","Ish traektoriya shakliga emas, boshlang‘ich va oxirgi nuqtaga bog‘liq.","Yopiq kontur bo‘yicha ish nolga teng — maydon potensialli."],y:"Zaryadni plastinalar orasida ko‘chirish.",m:"2 ta hisoblash masalasi.",q:[["q=2 nC, E=10⁴ V/m, d=0,04 m bo‘lsa A =","0,8 μJ|8 μJ|0,08 μJ",0],["Yopiq kontur bo‘yicha ish…","musbat|manfiy|nolga teng",2]],u:"Potensial energiya haqida o‘qib keling."}];

{key:"Tebranish — takrorlanuvchi harakat; amplituda A — eng katta chetlanish; davr T; chastota ν=1/T; siklik chastota ω=2π/T.",life:"Mashina amortizatori prujinasi; devor soati mayatnigi (l≈1 m → T≈2 s).",ex:["m=0,2 kg yuk k=50 N/m prujinada tebranadi. T va ν ni toping.","T=2π√(m/k)=6,28·√(0,2/50)≈0,40 s; ν=1/T=2,5 Hz."],q:[["Matematik mayatnik uzunligi 4 marta oshsa, T…","2 marta ortadi|4 marta ortadi|2 marta kamayadi",0],["Mayatnik davri nimaga bog‘liq emas?","uzunlikka|massaga|g ga",1]]},
{key:"Bevosita o‘lchash (l, t), bilvosita o‘lchash (g), absolyut va nisbiy xatolik, o‘rtacha qiymat.",life:"Geologlar g ning joydan joyga o‘zgarishi orqali foydali qazilmalarni qidiradi (gravimetriya).",ex:["l=0,5 m, 30 ta tebranish 42,6 s davom etdi. g ni toping.","T=42,6/30=1,42 s; g=4π²l/T²=39,5·0,5/2,02≈9,8 m/s²."],q:[["Nisbiy xatolik formulasi","Δg/g·100%|g·Δg|g+Δg",0],["Mayatnik uzunligini oshirsak, T…","ortadi|kamayadi|o‘zgarmaydi",0]]},
{key:"To‘lqin manbasi, muhit, to‘lqin fronti; ko‘ndalang to‘lqin (qattiq jism, suv yuzasi) va bo‘ylama to‘lqin (gaz, suyuqlik, qattiq jism).",life:"Dengiz to‘lqinlari; zilzila to‘lqinlari (P — bo‘ylama, S — ko‘ndalang).",ex:["To‘lqin tezligi 6 m/s, davri 0,5 s. λ=?","λ=v·T=6·0,5=3 m."],q:[["Suyuqlik ichida qanday to‘lqin tarqaladi?","faqat ko‘ndalang|bo‘ylama|tarqalmaydi",1],["λ=4 m, v=2 m/s bo‘lsa T=","2 s|8 s|0,5 s",0]]},
{key:"Tovush manbai — tebranuvchi jism; muhit shart. Tezlik: havoda 340, suvda ≈1500, po‘latda ≈5000 m/s.",life:"Exolokatsiya: delfin va ko‘rshapalak; tibbiyotda UZI (ultratovush).",ex:["Tovush qoyadan qaytib, 4 s dan so‘ng eshitildi. Qoyagacha masofa?","s=v·t/2=340·4/2=680 m."],q:[["Tovush qaysi muhitda eng tez tarqaladi?","havo|suv|po‘lat",2],["Ultratovush chastotasi…","16 Hz dan past|20 000 Hz dan yuqori|≈100 Hz",1]]},
{key:"ν=1/T; ω=2πν; v=λν; T=2π√(m/k); T=2π√(l/g).",life:"Musiqa asboblari: tor chastotasi nota balandligini belgilaydi.",ex:["Mayatnik 20 s da 10 marta tebrandi. T, ν va l ni toping.","T=20/10=2 s; ν=0,5 Hz; l=gT²/4π²=9,81·4/39,5≈1 m."],q:[["ν=50 Hz, v=340 m/s bo‘lsa λ≈","6,8 m|0,15 m|17 000 m",0],["10 s da 20 tebranish bo‘lsa T=","0,5 s|2 s|200 s",0]]},
{key:"Oqim chizig‘i, statsionar oqim, hajmiy sarf Q=S·v (m³/s).",life:"Daryo torayganda tezroq oqadi; shlang uchini siqsak suv uzoqqa otiladi.",ex:["Quvur kesimi 20 sm² dan 5 sm² ga torayadi. Birinchi qismda v=1 m/s. v₂=?","v₂=v₁S₁/S₂=1·20/5=4 m/s."],q:[["Hajmiy sarf Q=","S·v|S/v|v/S",0],["Q=0,02 m³/s, S=0,01 m² bo‘lsa v=","2 m/s|0,5 m/s|0,0002 m/s",0]]},
{key:"Statik bosim p, dinamik bosim ρv²/2, to‘liq bosim — ularning yig‘indisi.",life:"Pulverizator; kuchli shamolda tomning ko‘tarilishi; tez poyezd yaqinida odamni tortishi.",ex:["Gorizontal nayda suv: v₁=1 m/s, v₂=3 m/s. p₁−p₂=?","Δp=ρ(v₂²−v₁²)/2=1000·(9−1)/2=4000 Pa."],q:[["Gorizontal nay uchun Bernulli tenglamasi","p+ρv²/2=const|p·v=const|p/v=const",0],["Tezlik ortsa statik bosim…","ortadi|kamayadi|o‘zgarmaydi",1]]},
{key:"Ketma-ketlik: Q=const → v₂ → Δp. ρ(suv)=1000 kg/m³.",life:"Aorta va kapillyarlar: umumiy kesim ortgani sari qon tezligi kamayadi.",ex:["Quvur diametri 2 marta kamaydi, v₁=1 m/s. v₂ va Δp (suv) ni toping.","S∼d², S₁/S₂=4 → v₂=4 m/s; Δp=1000·(16−1)/2=7500 Pa."],q:[["Diametr 3 marta kamaysa tezlik…","3 marta ortadi|9 marta ortadi|o‘zgarmaydi",1],["Bosim birligi","Pa|N·s|J",0]]},
{key:"Mavzular: T, ν, λ, v; uzluksizlik; Bernulli qonuni.",life:"Tayyorgarlik: formulalar varag‘i va birliklar jadvali tuzing.",ex:["ν=5 Hz, λ=0,4 m. v=?","v=λ·ν=0,4·5=2 m/s."],q:[["Bernulli qonuni kimniki?","Nyuton|Daniil Bernulli|Paskal",1],["T=0,1 s bo‘lsa ν=","10 Hz|0,1 Hz|1 Hz",0]]},
{key:"Kuch chiziqlari: musbat zaryaddan chiqadi, manfiy zaryadga kiradi. E — vektor.",life:"Chaqmoq oldidan bulut va yer o‘rtasida kuchli maydon; changutgich va kseroks.",ex:["Ikki maydon: 6 va 8 N/C, o‘zaro perpendikulyar. E=?","E=√(6²+8²)=10 N/C."],q:[["Qarama-qarshi yo‘nalgan E₁=8, E₂=3 bo‘lsa E=","11|5|24",1],["Musbat zaryad maydon chizig‘i…","zaryadga kiradi|zaryaddan chiqadi|yopiq",1]]},
{key:"O‘tkazgichda zaryad sirtda joylashadi, ichida E=0; Faradey qafasi.",life:"Samolyot va avtomobil metall korpusi ichidagilarni chaqmoqdan himoya qiladi.",ex:["q=2 nC shar markazidan 3 sm masofada (tashqarida) E=? (k=9·10⁹)","E=kq/r²=9·10⁹·2·10⁻⁹/(9·10⁻⁴)=2·10⁴ N/C."],q:[["O‘tkazgich shardagi zaryad qayerda joylashadi?","butun hajmda|sirtda|markazda",1],["Faradey qafasi nimadan himoya qiladi?","elektr maydondan|ovozdan|issiqdan",0]]},

["Prujinali mayatnikda Guk qonuni F=−kx; Nyutonning 2-qonuniga ko‘ra ma=−kx, bundan ω²=k/m va T=2π√(m/k). Matematik mayatnikda qaytaruvchi kuch mg·sinα≈mg·α (α kichik), shuning uchun T=2π√(l/g). Tebranishda kinetik va potensial energiya o‘zaro aylanadi, to‘liq energiya saqlanadi: E=kA²/2.","Rivoyatga ko‘ra, Galiley 1583-yilda Piza soborida lyustra tebranishini o‘z tomir urishi bilan o‘lchab, davr amplitudaga bog‘liq emasligini payqagan. Gyuygens 1656-yilda birinchi mayatnikli soatni yaratdi.","Davrni massaga bog‘liq deb hisoblash (matematik mayatnikda bog‘liq emas); burchakni radianda olishni unutish; amplituda katta (15°–20° dan ortiq) bo‘lsa formula taxminiy ekanini unutish."],
["Mayatnik uzunligi ipning bog‘lanish nuqtasidan sharcha markazigacha o‘lchanadi. Burchak 10° dan oshmasin. 30 ta to‘liq tebranish vaqtini 3 marta o‘lchab, o‘rtacha t dan T=t/30 toping. So‘ng g=4π²l/T² hisoblanadi, har uzunlik uchun g topilib o‘rtachasi olinadi. Absolyut xatolik Δg=|g−g_o‘rt|.","Erkin tushish tezlanishi Yer qutbida ≈9,83, ekvatorda ≈9,78 m/s². Farq Yerning aylanishi va qutblarda yassiligi bilan bog‘liq. Standart qiymat g=9,80665 m/s².","Sekundomerni kech bosish; yarim tebranishni to‘liq deb sanash; ipning cho‘zilishi. Xatoni kamaytirish uchun ko‘p tebranish vaqti o‘lchanadi."],
["To‘lqin tarqalganda zarralar muvozanat vaziyati atrofida tebranadi, to‘lqin bilan ko‘chib ketmaydi. Ko‘ndalang to‘lqinda siljish tarqalish yo‘nalishiga perpendikulyar (qattiq jism, suyuqlik sirti). Bo‘ylama to‘lqinda zarralar tarqalish yo‘nalishida siqiladi va siyraklashadi (har qanday muhit). Bir davrda to‘lqin λ masofaga tarqaladi, shuning uchun v=λ/T=λν.","Gyuygens to‘lqin nazariyasining asoschilaridan: to‘lqin frontining har bir nuqtasi ikkilamchi to‘lqin manbaiga aylanadi (Gyuygens prinsipi, 1678).","To‘lqin tezligi bilan zarra tezligini aralashtirish; chastota manba bilan belgilanadi, muhit o‘zgarsa v va λ o‘zgaradi, ν o‘zgarmaydi."],
["Tovush manbai tebranib, havoni siqadi va siyraklashtiradi, bu bo‘ylama to‘lqin bo‘lib tarqaladi. Tezlik muhit zichligi va elastikligiga bog‘liq; havoda harorat 1°C ga ko‘tarilsa taxminan 0,6 m/s ortadi (0°C da 331 m/s). Kuchlilik amplituda kvadratiga, balandlik chastotaga bog‘liq; tembr overtonlar tarkibiga bog‘liq. Kuch detsibelda o‘lchanadi: shivir ≈30 dB, ko‘cha shovqini ≈80 dB, 120 dB dan yuqori og‘riq beradi.","Tovush tezligini 1738-yilda Parij akademiyasi to‘p otilishi yordamida o‘lchagan (≈337 m/s). 1947-yilda Chak Yeger birinchi bo‘lib tovush to‘siqidan o‘tdi.","Tovush vakuumda tarqaladi deb o‘ylash; aks-sadoda s=vt deb olish (to‘g‘risi s=vt/2); ultratovush eshitilmasligini unutish."],
["Masalada avval davr yoki chastotani aniqlang: N ta tebranish t vaqtda bo‘lsa T=t/N, ν=N/t. Prujinali mayatnikda T=2π√(m/k). To‘lqin masalasida v, λ, ν bog‘lanishini yozing va noma’lumni ifodalang. Oxirida birlik va javob mantiqini tekshiring.","Masalani tizimli yechish (chizma, berilgan, qonun, hisob, tahlil) Nyuton va Galiley davridan keyin ilmiy usul sifatida shakllangan.","sm va mm ni metrga o‘tkazmaslik; T bilan ν ni almashtirib yuborish; ildizni oxirida olishni unutish."],
["Statsionar oqimda har bir kesimdan vaqt birligida bir xil hajm oqib o‘tadi: Q=S₁v₁=S₂v₂. Bu massaning saqlanish qonunidan kelib chiqadi: suyuqlik siqilmaydi. Gazni ham, tezlik tovush tezligidan ancha kichik bo‘lsa, siqilmaydigan deb olish mumkin. Oqim chiziqlari zich joyda tezlik katta.","Gidrodinamika asoschilari: Daniil Bernulli (1738) va Leonard Eyler (XVIII asr).","Yuzani S=πd²/4 bilan hisoblashni unutish; kesim ortsa tezlik ortadi deb o‘ylash (aksincha kamayadi)."],
["Bernulli tenglamasi energiyaning saqlanishidan kelib chiqadi: p+ρv²/2+ρgh=const. Gorizontal nayda p+ρv²/2=const: tezlik ortsa, statik bosim kamayadi. Samolyot qanotining usti tomonida oqim tez, bosim kichik; pastida bosim katta, natijada ko‘tarish kuchi hosil bo‘ladi. Pulverizatorda tez havo oqimi nay uchida bosimni pasaytirib, suyuqlikni ko‘taradi.","Daniil Bernulli «Gidrodinamika» asarini 1738-yilda nashr etgan. Venturi nayi nomi italiyalik fizik Jovanni Venturi (1797) bilan bog‘liq.","Qonunni bitta oqim chizig‘i bo‘ylab qo‘llash kerakligini unutish; qanot ko‘tarilishini faqat Bernulli bilan izohlash (oqimning og‘ishi ham muhim)."],
["Birinchi qadam: S₁v₁=S₂v₂ dan v₂ topiladi. Ikkinchi qadam: p₁−p₂=ρ(v₂²−v₁²)/2. Balandlik o‘zgarsa ρg(h₂−h₁) qo‘shiladi. Torayish joyida bosim atmosferadan past bo‘lsa, yon naydan suyuqlik so‘riladi. Venturi hisoblagichi oqim tezligini bosim farqidan aniqlaydi.","Venturi nayi gaz va suv sarfini o‘lchashda hamda karbyuratorlarda ishlatiladi.","Zichlikni g/sm³ da qoldirish (SI da kg/m³); tezlikning kvadratini olishni unutish."],
["Takrorlash uchun asosiy formulalar: T=2π√(m/k), T=2π√(l/g), v=λν, S₁v₁=S₂v₂, p+ρv²/2=const. Avval oson savollarni yeching, murakkab masalalarga chizma chizing. Har bir javobda birlikni yozing. Vaqtning 10 % ini tekshirishga ajrating.","Reytingli baholash o‘quvchiga o‘z natijasini tahlil qilish va rivojlanishini ko‘rish imkonini beradi.","Savolni oxirigacha o‘qimaslik; SI ga o‘tkazmaslik; formulani ma’nosini tushunmay yodlash."],
["Elektr maydon kuchlanganligi E=F/q — sinov zaryadiga ta’sir etuvchi kuchning shu zaryadga nisbati. Nuqtaviy zaryad maydoni E=kq/r²; musbat zaryaddan tashqariga, manfiyga ichkariga yo‘nalgan. Superpozitsiya prinsipi: umumiy maydon har bir zaryad maydonining vektor yig‘indisi. Bir to‘g‘ri chiziqda maydonlar yo‘nalishiga qarab qo‘shiladi yoki ayriladi; burchak ostida Pifagor yoki kosinuslar teoremasi qo‘llanadi.","Maydon g‘oyasi va kuch chiziqlarini Maykl Faradey kiritgan (XIX asr), Maksvell uni matematik shaklga keltirgan.","E ni skalyar kabi qo‘shish; yo‘nalishni e’tiborsiz qoldirish; r ni zaryadlar orasidagi masofa deb olish (to‘g‘risi — zaryaddan nuqtagacha)."],
["Zaryadlangan o‘tkazgich sharda zaryad sirtda tekis taqsimlanadi. Ichida E=0, chunki erkin zaryadlar ichki maydonni nolga keltiradi. Tashqarida (r>R) E=kq/r², go‘yo butun zaryad markazda. Sirtda E=kq/R² (maksimal). E(r) grafigi r=R gacha nol, so‘ng 1/r² bo‘yicha kamayadi.","Faradey 1836-yilda metall qafas ichida elektr maydon yo‘qligini tajribada ko‘rsatgan — Faradey qafasi.","Shar ichida E=kq/r² deb hisoblash; r ni sirtdan emas, markazdan o‘lchash kerakligini unutish."],

["Tayyorgarlik: 1) tebranish va to‘lqin formulalari; 2) suyuqlik oqimi (uzluksizlik, Bernulli); 3) elektr maydon (Kulon, E, superpozitsiya, shar maydoni). Har mavzudan kamida 2 ta masala yeching. Testda noto‘g‘ri variantlarni chiqarib tashlash usulidan foydalaning. Masalani «Berilgan, Yechish, Javob» tuzilmasida yozing.","Chorak yakuniy ishi bilimni tizimli baholash va keyingi chorakka tayyorgarlik vositasidir.","Vaqtni bitta masalaga ko‘p sarflash; javobda birlikni yozmaslik; yaxlitlash xatosi."],
["Bir jinsli maydonda F=qE o‘zgarmas, shuning uchun A=F·d·cosα=qEd·cosα. Kuch chizig‘i bo‘ylab ko‘chsa (α=0) ish maksimal; perpendikulyar ko‘chsa (α=90°) ish nol. Ish traektoriyaga bog‘liq emas, shuning uchun elektrostatik maydon potensial. Ish potensial energiya kamayishiga teng: A=Wp1−Wp2. Yopiq kontur bo‘yicha ish nol.","Potensial tushunchasini Lagranj, Laplas va Puasson kiritgan; elektr potensial birligi volt Alessandro Volta nomi bilan atalgan.","Manfiy zaryad uchun ish ishorasini e’tiborsiz qoldirish; d ni traektoriya uzunligi deb olish (kerakli — maydon bo‘yicha siljish); sm ni metrga o‘tkazmaslik."]];

<div class="card"><h2>2. Nazariya</h2>${d.th.map((x,k)=>`<h3>${k+1}-reja</h3><p>${x}</p>`).join('')}<h3>Batafsil tushuntirish</h3><p>${Y[i][0]}</p><h3>Tarixiy ma’lumot</h3><p>${Y[i][1]}</p><h3>Ko‘p uchraydigan xatolar</h3><p>${Y[i][2]}</p><div class="fm">${d.f}</div><h3>Tayanch tushunchalar</h3><p>${X[i].key}</p><h3>Hayotiy misol</h3><p>${X[i].life}</p></div><div class="card"><h2>Namunaviy masala</h2><p><b>Masala:</b> ${X[i].ex[0]}</p><p><b>Yechim:</b> ${X[i].ex[1]}</p></div>
<div class="card"><h2>3. Simulyatsiya va animatsiya</h2><canvas id="cv" width="680" height="400"></canvas><div class="mu" style="color:var(--mu);margin-top:6px">${s[0]}: <b id="vl"></b></div><input type="range" id="sl" min="${s[1]}" max="${s[2]}" step="${s[4]}" value="${s[3]}"><button class="btn" id="pp">⏸ To‘xtatish</button><div class="ro" id="info"></div></div>
<div class="card"><h2>4. Test</h2>${d.q.map((q,k)=>`<div class="q"><b>${k+1}. ${q[0]}</b>${q[1].split('|').map((o,j)=>`<button class="o" data-k="${k}" data-j="${j}">${o}</button>`).join('')}</div>`).join('')}<div class="ro" id="sc">Natija: 0 / ${d.q.length}</div></div><div class="card"><h2>5. Qo‘shimcha masalalar</h2>${Z[i].m.map((x,k)=>`<details class="q"><summary><b>${k+1}.</b> ${x[0]}</summary><p style="margin-top:6px"><i>Yechim:</i> ${x[1]}</p></details>`).join('')}<h3>Tajriba</h3><p>${Z[i].t}</p><h3>Mini-o‘yin</h3><p>${Z[i].o}</p></div></div>`;
let sc=0;document.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const q=d.q[+b.dataset.k],p=b.parentNode;if(p.dataset.d)return;p.dataset.d=1;const ok=+b.dataset.j==q[2];b.classList.add(ok?'ok':'no');if(!ok)p.querySelectorAll('.o')[q[2]].classList.add('ok');if(ok)sc++;$('sc').textContent=`Natija: ${sc} / ${d.q.length}`});
ctx=$('cv').getContext('2d');ctx.scale(2,2);const sl=$('sl');V=+sl.value;sl.oninput=()=>V=+sl.value;run=true;t=0;$('pp').onclick=()=>{run=!run;$('pp').textContent=run?'⏸ To‘xtatish':'▶ Davom etish'};
P=[];for(let k=0;k<30;k++)P.push({x:Math.random()*340,y:Math.random()*2-1,u:Math.random()*340,w:Math.random()*200});loop()}
function loop(){if(run)t+=1/60;const c=ctx,W=340,H=200,col=getComputedStyle(document.body).color,ac='#1a9f6a',s=D[cur].s;c.clearRect(0,0,W,H);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2;$('vl').textContent=V;let info='';
if(s=='pend'){const T=2*Math.PI*Math.sqrt(V/9.81),a=.35*Math.cos(2*Math.PI*t/T),L=V*80,x=170+L*Math.sin(a),y=15+L*Math.cos(a);c.beginPath();c.moveTo(170,15);c.lineTo(x,y);c.stroke();c.fillStyle=ac;c.beginPath();c.arc(x,y,10,0,7);c.fill();info=`T=2π√(l/g)=${T.toFixed(2)} s → g=4π²l/T²=${(4*Math.PI**2*V/T**2).toFixed(2)} m/s²`}
if(s=='spring'){const T=2*Math.PI*Math.sqrt(V/20),y=110+40*Math.cos(2*Math.PI*t/T);c.beginPath();c.moveTo(170,10);for(let k=1;k<=10;k++)c.lineTo(170+(k%2?-14:14),10+(y-40)*k/10);c.lineTo(170,y-30);c.stroke();c.fillStyle=ac;c.fillRect(150,y-30,40,30);info=`k=20 N/m, T=2π√(m/k)=${T.toFixed(2)} s, ν=${(1/T).toFixed(2)} Hz`}
if(s=='wave'){const v=D[cur].v,lp=300/V;c.beginPath();for(let x=0;x<=W;x+=2){const y=100+45*Math.sin(2*Math.PI*(x/lp-V*t*.4));x?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle=ac;c.stroke();info=`ν=${V} Hz, v=${v} m/s → λ=v/ν=${(v/V).toFixed(v>10?1:2)} m, T=${(1/V).toFixed(2)} s`}
if(s=='pipe'){const h=x=>x>120&&x<220?V:40;c.beginPath();for(let x=0;x<=W;x+=4)c.lineTo(x,100-h(x));c.moveTo(0,100+h(0));for(let x=0;x<=W;x+=4)c.lineTo(x,100+h(x));c.stroke();c.fillStyle=ac;P.forEach(p=>{if(run)p.x+=1.2*40/h(p.x);if(p.x>W)p.x=0;c.beginPath();c.arc(p.x,100+p.y*(h(p.x)-4),3,0,7);c.fill()});info=`S₁v₁=S₂v₂ → v₂/v₁=${(40/V).toFixed(1)} marta. Tor qismda tezlik katta, bosim kichik (Bernulli).`}
if(s=='field'){const q=[5,V],X=[100,240],E=(x,y)=>{let a=0,b=0;for(let i=0;i<2;i++){const dx=x-X[i],dy=y-100,r=Math.hypot(dx,dy)+1;a+=q[i]*dx/r**3;b+=q[i]*dy/r**3}return[a,b]};c.fillStyle='#d33';c.beginPath();c.arc(100,100,9,0,7);c.fill();c.fillStyle=V<0?'#36c':'#d33';c.beginPath();c.arc(240,100,9,0,7);c.fill();c.strokeStyle=ac;c.lineWidth=1.5;for(let x=20;x<W;x+=40)for(let y=20;y<H;y+=40){const[a,b]=E(x,y),m=Math.hypot(a,b)||1;c.beginPath();c.moveTo(x,y);c.lineTo(x+14*a/m,y+14*b/m);c.stroke()}c.fillStyle=col;P.forEach(p=>{const[a,b]=E(p.u,p.w),m=Math.hypot(a,b)||1;if(run){p.u+=2*a/m;p.w+=2*b/m}if(p.u<0||p.u>W||p.w<0||p.w>H||Math.hypot(p.u-100,p.w-100)<9||Math.hypot(p.u-240,p.w-100)<9){p.u=Math.random()*W;p.w=Math.random()*H}c.beginPath();c.arc(p.u,p.w,2.5,0,7);c.fill()});info=`q₁=+5 (qizil), q₂=${V}. Sinov zaryadlar E yo‘nalishida harakatlanadi: E=E₁+E₂ (vektor).`}
if(s=='work'){const f=(t%3)/3,x=40+f*V*35;c.fillStyle='#d33';c.fillRect(20,20,6,160);c.fillStyle='#36c';c.fillRect(314,20,6,160);c.strokeStyle=ac;for(let y=40;y<=160;y+=30){c.beginPath();c.moveTo(30,y);c.lineTo(305,y);c.lineTo(297,y-4);c.moveTo(305,y);c.lineTo(297,y+4);c.stroke()}c.fillStyle='#d33';c.beginPath();c.arc(x,100,9,0,7);c.fill();info=`q=2 nC, E=10⁴ V/m, d=${V} sm → A=qEd=${(2e-9*1e4*V/100*1e6).toFixed(1)} mkJ`}
$('info').textContent=info;raf=requestAnimationFrame(loop)}
document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>go(+e.dataset.i));$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('menu').onclick=()=>$('side').classList.toggle('open');
const m=/^#d(\d+)$/.exec(location.hash);go(m&&+m[1]>=19&&+m[1]<=32?+m[1]-19:-1);
</script></body></html>
