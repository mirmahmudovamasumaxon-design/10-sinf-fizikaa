<script>
const T=['Kuchlarni qo‘shish', 'Bir nechta kuch ta’siridagi harakat', 'Jism og‘irligi', 'Gravitatsiya maydonidagi harakat', 'Markazga intilma kuch', 'Qiya tekislik', 'Qiya tekislikdagi harakat', 'Qiya tekislik — laboratoriya', 'Massa markaz va kuch momenti', 'Momentlar qoidasi', 'Oddiy mexanizmlarni yasash'];
const fr=document.getElementById('fr'),home=document.getElementById('home'),side=document.getElementById('side');
let cur=-1;
function dec(i){const b=atob(document.getElementById('d'+i).textContent.trim());const u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);return new TextDecoder('utf-8').decode(u)}
function go(i){
 cur=i;
 document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
 document.getElementById('title').textContent=i<0?'Bosh sahifa':(i+1)+'. '+T[i];
 document.getElementById('prev').disabled=i<0;document.getElementById('next').disabled=i>=T.length-1;
 if(i<0){home.style.display='';fr.style.display='none';fr.srcdoc='';}
 else{home.style.display='none';fr.style.display='';fr.srcdoc=dec(i);}
 side.classList.remove('open');
 history.replaceState(null,'',i<0?'#':'#d'+(i+1));
}
document.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>go(+e.dataset.i));
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('menu').onclick=()=>side.classList.toggle('open');
const m=/^#d(\d+)$/.exec(location.hash);go(m&&+m[1]<=T.length?+m[1]-1:-1);
</script></body></html>
